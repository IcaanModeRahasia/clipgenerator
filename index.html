<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real AI Video Clipper</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #1e293b; padding: 20px; border-radius: 10px; }
        video, canvas { width: 100%; border-radius: 8px; margin-top: 10px; background: #000; }
        button, input { margin-top: 10px; padding: 10px; width: 100%; border-radius: 5px; border: none; cursor: pointer; }
        button { background: #6366f1; color: white; font-weight: bold; }
        button:hover { background: #4f46e5; }
        .status { color: #38bdf8; margin-top: 10px; font-size: 0.9rem; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>Real Video Clipper & Exporter</h2>
    <p style="font-size: 0.85rem; color: #94a3b8;">Unggah video (1 - 30 menit) dan ekspor hasil klip berornamen secara nyata.</p>
    
    <input type="file" id="videoInput" accept="video/*">
    <div id="status" class="status"></div>

    <canvas id="previewCanvas" style="display:none;"></canvas>
    <video id="videoPlayer" controls style="display:none;"></video>

    <button id="btnExport">Ekspor & Download Video Klip (5 Detik Sample)</button>
    <a id="downloadLink" style="display:none; color: #4ade80; text-align:center; block; margin-top:10px;">⬇️ Klik di sini untuk mengunduh video hasil render</a>
</div>

<script>
    const videoInput = document.getElementById('videoInput');
    const videoPlayer = document.getElementById('videoPlayer');
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const btnExport = document.getElementById('btnExport');
    const status = document.getElementById('status');
    const downloadLink = document.getElementById('downloadLink');

    let videoFile = null;

    videoInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const fileURL = URL.createObjectURL(file);
        videoPlayer.src = fileURL;

        videoPlayer.onloadedmetadata = () => {
            const duration = videoPlayer.duration;
            if (duration < 60 || duration > 1800) {
                status.textContent = `❌ Gagal: Durasi video harus 1–30 menit! (Durasi Anda: ${Math.round(duration/60)} mnt)`;
                videoPlayer.style.display = 'none';
                return;
            }
            status.textContent = "✅ Video valid! Siap diproses.";
            videoPlayer.style.display = 'block';
            videoFile = fileURL;
        };
    });

    btnExport.addEventListener('click', () => {
        if (!videoPlayer.src) {
            alert("Silakan pilih video terlebih dahulu!");
            return;
        }

        status.textContent = "⏳ Memproses & merender video beserta ornamen...";
        
        // Atur ukuran canvas sesuai ukuran video
        canvas.width = videoPlayer.videoWidth || 640;
        canvas.height = videoPlayer.videoHeight || 360;
        canvas.style.display = 'block';
        videoPlayer.style.display = 'none';

        // Rekam canvas menggunakan MediaRecorder API
        const stream = canvas.captureStream(30); // 30 FPS
        const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        const chunks = [];

        mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
        mediaRecorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const resultURL = URL.createObjectURL(blob);
            
            downloadLink.href = resultURL;
            downloadLink.download = "hasil-klip-video.webm";
            downloadLink.style.display = 'block';
            status.textContent = "🎉 Selesai! Klik link di bawah untuk mengunduh file video nyata.";
        };

        // Mulai pemutaran & perekaman
        videoPlayer.currentTime = 0;
        videoPlayer.play();
        mediaRecorder.start();

        // Loop untuk menggambar frame video + Ornamen Teks di Canvas
        function drawFrame() {
            if (videoPlayer.paused || videoPlayer.ended) return;
            
            // 1. Gambar Video
            ctx.drawImage(videoPlayer, 0, 0, canvas.width, canvas.height);

            // 2. Gambar Ornamen / Watermark / Highlight secara Nyata
            ctx.fillStyle = "rgba(99, 102, 241, 0.8)";
            ctx.fillRect(canvas.width - 180, 20, 160, 40);
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 16px Arial";
            ctx.fillText("🔥 TOP CLIP", canvas.width - 150, 46);

            requestAnimationFrame(drawFrame);
        }
        drawFrame();

        // Berhenti merekam setelah 5 detik (Sebagai contoh klip)
        setTimeout(() => {
            videoPlayer.pause();
            mediaRecorder.stop();
        }, 5000);
    });
</script>

</body>
</html>
